name: Continuous Deployment

permissions:
  contents: read

on:
  workflow_run:
    workflows:
      - Continuous Integration
    branches:
      - main
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: continuous-deployment-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: false

jobs:
  deploy-worker:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    name: Deploy Cloudflare Worker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Environment
        uses: ./.github/actions/setup-env

      - name: Prepare Wrangler Configuration
        uses: ./.github/actions/retry-step
        with:
          command: pnpm exec tsx scripts/prepare-wrangler-config.ts
          max_attempts: '3'
        env:
          WRANGLER_JSONC: ${{ vars.WRANGLER_JSONC }}
          WRANGLER_PATCH_JSON: ${{ vars.WRANGLER_PATCH_JSON }}
          WRANGLER_VARS_PATCH_JSON: ${{ vars.WRANGLER_VARS_PATCH_JSON }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy with Wrangler
        uses: ./.github/actions/retry-step
        with:
          command: pnpm exec wrangler deploy --dry-run && pnpm exec wrangler deploy
          max_attempts: '3'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
